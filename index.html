<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>多模態設計訪談與急速報價中心 - 暮川設計</title>
  
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&amp;family=Noto&#43;Sans&#43;TC:wght@300;400;500;600&amp;family=Noto&#43;Serif&#43;TC:wght@500;700&amp;display=swap" rel="stylesheet">
  
  
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
     
    :root {
       
      --brand-gradient: linear-gradient(135deg, #646b77 0%, #1c222b 100%);
      
       
      --bg-pure: #FFFFFF;
      --text-primary: #111111;
      --text-secondary: #555555;
      --text-muted: #999999;
      
      --line-dark: #111111;
      --line-light: #E0E0E0;
      
      --touch-target: 40px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

     
    body {
      font-family: 'Noto Sans TC', 'Inter', sans-serif;
      background-color: var(--bg-pure) !important; 
      color: var(--text-primary) !important;
      line-height: 1.6;
      font-size: 14px;
      padding-bottom: 80px;
      -webkit-font-smoothing: antialiased;
      margin: 0;
    }

    .brand-serif { font-family: 'Noto Serif TC', serif; }

     
    .hero-visual {
      background: var(--brand-gradient);
      color: #FFFFFF;
      padding: 30px 40px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 180px;
      position: relative;
    }
    .hero-logo-area {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 4px;
    }
    .hero-logo-mark {
      width: 28px; height: 42px;
      border: 1px solid rgba(255,255,255,0.4);
      border-radius: 14px;
      display: flex; align-items: center; justify-content: center;
      margin-bottom: 8px;
    }
    .hero-logo-text { font-size: 0.9rem; letter-spacing: 2px; }
    .hero-logo-sub { font-size: 0.55rem; letter-spacing: 1px; font-family: 'Inter', sans-serif; opacity: 0.7; }
    
    .hero-title-area {
      align-self: flex-end;
      text-align: right;
      margin-top: 20px;
    }
    .hero-title {
      font-size: 1.8rem;
      font-weight: 700;
      letter-spacing: 4px;
      margin-bottom: 8px;
      display: inline-block;
      border-bottom: 2px solid #FFFFFF;
      padding-bottom: 6px;
    }
    .hero-subtitle {
      font-size: 0.9rem;
      letter-spacing: 2px;
      opacity: 0.9;
    }

     
    .app-main { 
      max-width: 1600px;  
      margin: 0 auto; 
      padding: 32px 40px; 
      background-color: var(--bg-pure) !important;
    }
    
     
    .toolbar { display: flex; justify-content: flex-end; gap: 12px; margin-bottom: 32px; align-items: center; }
    .pill {
      padding: 8px 18px; background: #FFFFFF !important; border: 1px solid var(--line-light);
      border-radius: 0; font-size: 0.85rem; color: var(--text-secondary); cursor: pointer; transition: all 0.2s ease;
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    }
     
    .pill:hover { border-color: var(--line-dark); color: var(--text-primary); background-color: #FAFAFA !important; box-shadow: 2px 2px 0px rgba(0,0,0,0.1); transform: translate(-1px, -1px); }
    .pill.active { border-color: var(--line-dark); color: var(--text-primary); font-weight: 600; }
    .select-minimal {
      border: none; border-bottom: 1px solid var(--line-dark); border-radius: 0;
      padding: 6px 0; background: #FFFFFF !important; color: var(--text-primary);
      font-size: 0.9rem; outline: none; cursor: pointer; min-width: 220px; transition: 0.2s;
    }
    .select-minimal:hover { border-bottom-width: 2px; }

     
    .subtabs-nav {
      display: flex; gap: 40px; border-bottom: 1px solid var(--line-light);
      margin-bottom: 32px; overflow-x: auto; background: #FFFFFF !important;
    }
    .subtab-btn {
      display: flex; align-items: center; gap: 8px; padding: 16px 0;
      background: #FFFFFF !important; border: none; border-bottom: 2px solid transparent;
      color: var(--text-muted); font-size: 1rem; cursor: pointer; transition: 0.2s;
    }
    .subtab-btn.active { color: var(--line-dark); border-bottom-color: var(--line-dark); font-weight: 600; }

     
    .view-grid-layout { display: grid; grid-template-columns: minmax(0, 1fr); gap: 32px; }
    @media (min-width: 1024px) {
       
      .view-grid-layout { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); align-items: start; }
      .view-grid-layout.design-split { grid-template-columns: minmax(0, 4.5fr) minmax(0, 5.5fr); } 
      .panel-sticky { position: sticky; top: 24px; }
      .mobile-design-tabs { display: none !important; }
      .design-panel { display: block !important; width: 100%; }
    }
    @media (max-width: 1023px) {
      .mobile-design-tabs { display: flex; gap: 16px; margin-bottom: 24px; border-bottom: 1px solid var(--line-light); }
      .mobile-tab-btn { flex: 1; padding: 12px 0; text-align: center; font-weight: 500; color: var(--text-muted); background: #FFFFFF; border: none; border-bottom: 2px solid transparent; cursor: pointer; }
      .mobile-tab-btn.active { color: var(--line-dark); border-bottom-color: var(--line-dark); font-weight: 600; }
      .design-panel { display: none; }
      .design-panel.active { display: block; }
    }

     
    .metric-card, .quote-item-card { 
      background-color: #FFFFFF !important; 
      border: 1px solid var(--line-light) !important; 
      padding: 32px; display: flex; flex-direction: column; margin-bottom: 24px;
    }
     
    .quote-item-card.table-card { padding: 0; }
    .quote-item-card.table-card .item-card-header { padding: 24px 32px 16px 32px; margin-bottom: 0; }

    .item-card-header { 
      display: flex; justify-content: space-between; align-items: center; 
      margin-bottom: 24px; padding-bottom: 12px; border-bottom: 1px solid var(--line-dark); 
    }
    .item-card-header h3 { font-family: 'Noto Serif TC', serif; font-size: 1.2rem; letter-spacing: 1px; font-weight: 700; color: #111; }
    
    .input-field-group { display: flex; flex-direction: column; gap: 8px; margin-bottom: 20px; }
    .input-field-label { font-size: 0.85rem; color: var(--text-secondary); letter-spacing: 0.5px; }
    
    .spec-input, textarea.spec-input { 
      border: 1px solid var(--line-light) !important; 
      padding: 10px 14px; min-height: 40px; width: 100%; 
      background-color: #FFFFFF !important; 
      color: #111111 !important; transition: 0.2s;
    }
    .spec-input:focus, textarea.spec-input:focus { outline: none; border-color: var(--line-dark) !important; }
    textarea.spec-input { resize: vertical; min-height: 100px; }

     
    .btn { 
      min-height: var(--touch-target); padding: 0 20px; 
      display: inline-flex; align-items: center; justify-content: center; gap: 8px; 
      font-size: 0.9rem; letter-spacing: 1px; cursor: pointer; 
      background-color: #FFFFFF !important; border: 1px solid var(--line-light) !important; border-radius: 0;
      color: var(--text-primary) !important; transition: 0.2s;
    }
    .btn:hover { border-color: var(--line-dark) !important; }
    .btn-primary { background-color: var(--line-dark) !important; color: #FFFFFF !important; border-color: var(--line-dark) !important; }
    .btn-primary:hover { background-color: #333333 !important; }

     
    .accordion-item { border: 1px solid var(--line-light) !important; margin-bottom: 16px; background-color: #FFFFFF !important; }
    .accordion-header { 
      padding: 18px 16px; background-color: #FFFFFF !important; cursor: pointer; 
      display: flex; justify-content: space-between; align-items: center; 
      font-weight: 500; transition: 0.2s; color: var(--text-primary);
      border-bottom: 1px solid transparent;
    }
    .accordion-header:hover { background-color: #FAFAFA !important; }
    .accordion-header.active-record { font-weight: 700; border-bottom: 1px solid var(--line-light); border-left: 3px solid var(--line-dark); }
    .accordion-content { padding: 24px 16px; display: none; background-color: #FFFFFF !important; }
    .accordion-content.active { display: block; }
    
     
    .carousel-container { position: relative; width: 100%; background: #FAFAFA !important; border: 1px solid var(--line-light); overflow: hidden; display: flex; align-items: center; justify-content: center; margin-bottom: 20px; min-height: 280px; }
    .carousel-img { width: 100%; object-fit: contain; max-height: 400px; display: none; }
    .carousel-img.active { display: block; }
    .carousel-btn { position: absolute; top: 50%; transform: translateY(-50%); background: #FFFFFF; border: 1px solid var(--line-light); width: 36px; height: 36px; cursor: pointer; display: flex; align-items: center; justify-content: center; z-index: 2; color: #111; }
    .carousel-btn:hover { border-color: var(--line-dark); }
    .carousel-btn.left { left: 12px; }
    .carousel-btn.right { right: 12px; }

     
    .material-table-wrapper { overflow-x: auto; margin-bottom: 16px; background-color: #FFFFFF !important; padding: 0 32px; }
    .material-table { width: 100%; border-collapse: collapse; font-size: 0.9rem; min-width: 900px; background-color: #FFFFFF !important; }
    .material-table th, .material-table td { padding: 18px 12px; text-align: left; border-bottom: 1px solid var(--line-light); color: #111; }
    .material-table th { 
      border-top: 1px solid var(--line-dark); border-bottom: 1px solid var(--line-dark); 
      font-family: 'Noto Serif TC', serif; font-weight: 600; background-color: #FFFFFF !important;
      padding-top: 16px; padding-bottom: 16px;
    }
    .material-table input, .material-table select { 
      width: 100%; border: 1px solid transparent; padding: 8px; 
      background: transparent; transition: 0.2s; color:#111;
    }
    .material-table input:focus, .material-table select:focus { border-color: var(--line-light); outline: none; background: #FAFAFA; }

    .tab-content-panel { display: none; animation: fadeIn 0.3s ease; }
    .tab-content-panel.active { display: block; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

     
    .a4-viewport-container {
      background: #EAEAEA !important;
      padding: 40px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
      overflow-x: auto;  
    }
     
    .a4-sheet {
      width: 794px;  
      height: 1123px;  
      background: #FFFFFF !important;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
      border: 1px solid #D1D5DB;
      position: relative;
      box-sizing: border-box;
      margin-bottom: 36px !important; 
      flex-shrink: 0;  
      overflow: hidden;  
    }
    .a4-body-page {
      padding: 60px 70px;
      color: #111111 !important;
      font-size: 15px;  
      line-height: 1.8;
      font-family: 'Noto Sans TC', sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      height: 100%;
      box-sizing: border-box;
    }
    .a4-page-footer {
      text-align: center;
      font-size: 0.75rem;
      color: #888888;
      margin-top: 24px;
      padding-top: 12px;
      border-top: 1px solid #EEEEEE;
    }
     
    .a4-cover-page {
      background: linear-gradient(145deg, #3d4552 0%, #1a2029 100%) !important;
      color: #FFFFFF !important;
      padding: 60px 48px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      height: 100%;
      box-sizing: border-box;
    }
    .cover-emblem-badge {
      width: 90px;
      height: 140px;
      border: 1.5px solid rgba(255, 255, 255, 0.45);
      border-radius: 45px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: 40px auto 0 auto;
      padding: 10px 0;
      gap: 4px;
    }
    .cover-circle-dot {
      width: 12px;
      height: 12px;
      background: #FFFFFF;
      border-radius: 50%;
      margin-bottom: 2px;
    }
    .cover-s-curve {
      font-size: 2.2rem;
      line-height: 1;
      font-family: 'Noto Serif TC', serif;
      font-weight: 300;
      color: #FFFFFF;
    }
    .cover-brand-ch {
      font-family: 'Noto Serif TC', serif;
      font-size: 0.85rem;
      letter-spacing: 2px;
    }
    .cover-brand-en {
      font-size: 0.45rem;
      letter-spacing: 1px;
      opacity: 0.75;
      font-family: 'Inter', sans-serif;
    }
    .cover-title-box {
      text-align: center;
      margin: 70px 0;
    }
    .cover-project-name {
      font-family: 'Noto Serif TC', serif;
      font-size: 1.6rem;
      letter-spacing: 3px;
      margin-bottom: 24px;
      font-weight: 500;
    }
    .cover-contract-type {
      font-family: 'Noto Serif TC', serif;
      font-size: 2.3rem;
      font-weight: 700;
      letter-spacing: 6px;
      padding: 16px 0;
      border-top: 1px solid rgba(255, 255, 255, 0.4);
      border-bottom: 1px solid rgba(255, 255, 255, 0.4);
      display: inline-block;
      min-width: 82%;
    }
    .cover-footer {
      text-align: center;
      border-top: 1px solid rgba(255, 255, 255, 0.25);
      padding-top: 24px;
    }
     
    .a4-body-page h2 {
      font-family: 'Noto Serif TC', serif;
      font-size: 1.55rem;
      text-align: center;
      letter-spacing: 3px;
      margin-bottom: 24px;
      padding-bottom: 12px;
      border-bottom: 2px solid #111111;
    }
    .a4-clause-title {
      font-family: 'Noto Serif TC', serif;
      font-weight: 700;
      font-size: 1.05rem;
      margin: 16px 0 6px 0;
      color: #000;
    }
    .a4-table {
      width: 100%;
      border-collapse: collapse;
      margin: 12px 0 16px 0;
    }
    .a4-table th, .a4-table td {
      border: 1px solid #111111;
      padding: 8px 12px;
      font-size: 0.85rem;
    }
    .a4-table th {
      background: #F4F4F4 !important;
      font-weight: 600;
    }
    .a4-signature-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 32px;
      margin-top: 32px;
      padding-top: 20px;
      border-top: 1px solid #111111;
    }
     
    .quote-item-card.table-card > div[style*="overflow-x:auto"] {
      display: flex !important;
      flex-wrap: nowrap !important;
      gap: 12px !important;
      overflow-x: auto !important;
      padding: 12px 32px 16px 32px !important;
      scrollbar-width: thin !important;
    }

    .quote-item-card.table-card > div[style*="overflow-x:auto"] .pill {
      white-space: nowrap !important;
      flex: 0 0 auto !important;
      min-width: 110px !important;
      height: 38px !important;
      padding: 0 16px !important;
      display: inline-flex !important;
      align-items: center !important;
      justify-content: center !important;
      font-size: 0.88rem !important;
      font-weight: 500 !important;
      cursor: pointer !important;
      border-radius: 4px !important;
    }

    .quote-item-card.table-card > div[style*="overflow-x:auto"] .pill.active {
      background-color: #111111 !important;
      color: #FFFFFF !important;
      border-color: #111111 !important;
      font-weight: 600 !important;
    }
  </style>
</head>
<body>

  
  <header class="hero-visual">
    <div class="hero-logo-area">
      
      <div class="hero-logo-mark"><span class="brand-serif" style="font-size:1.1rem;">S</span></div>
      <div class="hero-logo-text brand-serif">暮川設計</div>
      <div class="hero-logo-sub">EVENSTREAM DESIGN</div>
    </div>
    <div class="hero-title-area">
      <h1 class="hero-title brand-serif">多模態設計與報價中心</h1>
      <div class="hero-subtitle brand-serif">室內設計承攬系統</div>
    </div>
  </header>

  
  <main class="app-main">
    
    
    <div class="toolbar">
      
      <button class="pill" style="border-color: var(--line-dark); color: var(--text-primary); font-weight: 600;" onclick="AppMode.setNewMode()">
        <i data-lucide="folder-plus" style="width:16px;"></i> 新建專案
      </button>
      
      
      <div style="width: 1px; height: 20px; background-color: var(--line-light); margin: 0 8px;"></div>
      
      
      <span style="font-size: 0.85rem; color: var(--text-secondary);">切換案場：</span>
      <select id="select-active-project" class="select-minimal">
        <option value="">選擇專案...</option>
      </select>
    </div>

    <section class="app-view">
      
      <nav class="subtabs-nav">
        <button class="subtab-btn" data-tab="tab-audio"><i data-lucide="mic"></i> 丈量</button>
        <button class="subtab-btn active" data-tab="tab-design"><i data-lucide="layers"></i> 選材</button>
        <button class="subtab-btn" data-tab="tab-ocr"><i data-lucide="file-text"></i> 成本</button>
        <button class="subtab-btn" data-tab="tab-quote"><i data-lucide="check-square"></i> 報價</button>
        <button class="subtab-btn" data-tab="tab-profit"><i data-lucide="pie-chart"></i> 毛利</button>
        <button class="subtab-btn" data-tab="tab-legal"><i data-lucide="scale"></i> 法務</button>
      </nav>

      
      <div id="tab-audio" class="tab-content-panel">
        <div id="audio-workspace-panel" class="view-grid-layout">
          <div>
            <div style="border: 1px dashed var(--line-light); padding: 40px; text-align: center; margin-bottom: 32px; background:#FFF;">
              <button id="btn-record" class="btn btn-primary" onclick="AudioManager.startRecord()"><i data-lucide="mic"></i> 錄音</button>
              <button id="btn-stop" class="btn" onclick="AudioManager.stopRecord()" disabled><i data-lucide="square"></i> 停止</button>
              <div id="audio-timer" style="font-size:2rem; font-family:'Inter', sans-serif; font-weight:300; margin-top:16px;">00:00</div>
            </div>
            
            <div class="quote-item-card">
              <div class="item-card-header">
                <h3>逐字稿</h3>
                <button class="btn" style="min-height:32px;" onclick="ProjectManager.saveTextField('transcript', 'live-transcript')">儲存</button>
              </div>
              <textarea id="live-transcript" class="spec-input" style="border:none; min-height:180px;"></textarea>
            </div>
            
            <div class="quote-item-card">
              <div class="item-card-header">
                <h3>注記</h3>
                <button class="btn" style="min-height:32px;" onclick="ProjectManager.saveTextField('notes', 'live-notes')">儲存</button>
              </div>
              <textarea id="live-notes" class="spec-input" style="border:none; min-height:120px;"></textarea>
            </div>
          </div>

          <div class="panel-sticky">
            <div class="metric-card">
              <div style="display:flex; gap:16px; margin-bottom:24px;">
                <button class="btn btn-primary" onclick="ProjectManager.generateAnalysis('summary')" style="flex:1;"><i data-lucide="cpu"></i> 總結</button>
                <button class="btn btn-primary" onclick="ProjectManager.generateAnalysis('warning')" style="flex:1;"><i data-lucide="alert-circle"></i> 注意</button>
              </div>
              <div class="input-field-group">
                <label class="input-field-label">專案總結</label>
                <textarea id="box-summary" class="spec-input"></textarea>
                <button class="btn" style="margin-top:12px;" onclick="ProjectManager.saveTextField('summary', 'box-summary')">儲存總結</button>
              </div>
              <div class="input-field-group" style="margin-top:24px;">
                <label class="input-field-label">防禦與注意</label>
                <textarea id="box-warning" class="spec-input"></textarea>
                <button class="btn" style="margin-top:12px;" onclick="ProjectManager.saveTextField('warning', 'box-warning')">儲存注意</button>
              </div>
            </div>
          </div>
        </div>
      </div>

      
      <div id="tab-design" class="tab-content-panel active">
        <div class="mobile-design-tabs">
          <button class="mobile-tab-btn active" id="btn-mobile-left" onclick="DesignManager.switchMobileTab('left')">紀錄</button>
          <button class="mobile-tab-btn" id="btn-mobile-right" onclick="DesignManager.switchMobileTab('right')">清單</button>
        </div>
        
        <div class="view-grid-layout design-split">
          
          <div id="design-panel-left" class="design-panel active">
            <button class="btn btn-primary" onclick="DesignManager.addNewRecord()" style="width:100%; margin-bottom:24px;"><i data-lucide="plus"></i> 新增紀錄</button>
            <div id="design-records-container"></div>
          </div>
          
          
          <div id="design-panel-right" class="design-panel panel-sticky">
            <div class="quote-item-card table-card" style="border:none; display:flex; flex-direction:column; max-height:85vh;">
              <div class="item-card-header">
                <h3 id="current-record-title">選材清單</h3>
                <button class="btn" style="border:none;" onclick="DesignManager.addEmptyMaterial()" title="新增"><i data-lucide="plus"></i> 新增</button>
              </div>
              
              <div class="material-table-wrapper" style="flex:1;">
                <table class="material-table">
                  <thead>
                    <tr>
                      <th style="width:40px;">#</th>
                      <th style="width:100px;">區域</th>
                      <th style="width:180px;">施作名稱</th>
                      <th style="width:180px;">材質</th>
                      <th style="width:80px;">數量</th>
                      <th style="width:80px;">單位</th>
                      <th style="width:100px;">單價</th>
                      <th style="width:120px;">計價</th>
                      <th style="width:60px; text-align:center;">暫估</th>
                      <th style="width:40px;"></th>
                    </tr>
                  </thead>
                  <tbody id="design-materials-tbody">
                    
                  </tbody>
                </table>
              </div>
              
              <div style="padding:24px 32px; border-top:1px solid var(--line-light); display:flex; gap:16px;">
                <button class="btn btn-primary" onclick="DesignManager.saveCurrentRecord()" style="flex:1;">儲存清單</button>
                <button class="btn" onclick="SyncEngine.transferMaterialToQuote()" style="flex:1;"><i data-lucide="send"></i> 拋轉至報價</button>
              </div>
            </div>
          </div>
        </div>
      </div>

      
      <div id="tab-ocr" class="tab-content-panel">
        <div class="view-grid-layout design-split">

  <script>
    const GAS_WEB_URL = 'https://script.google.com/macros/s/AKfycbwV_5WAcUo5SKSgYCAG0zdXz0M71aIcOg_ZZr0ybTwCDMrvjdiYCmd0MdZfFkjTddbxbA/exec';
    
    
    
    
    const Toast = {
      init() {
        const c = document.createElement('div');
        c.id = 'toast-container';
        c.style.cssText = 'position:fixed; top:32px; left:50%; transform:translateX(-50%); z-index:9999; display:flex; flex-direction:column; gap:12px; align-items:center; pointer-events:none;';
        document.body.appendChild(c);
      },
      show(msg, type='info') {
        const t = document.createElement('div');
        const isErr = type === 'error';
        t.style.cssText = `padding:14px 32px; border:1px solid ${isErr?'#ff4d4f':'#111'}; font-weight:500; font-size:0.95rem; background:#FFF; color:${isErr?'#ff4d4f':'#111'}; box-shadow:0 12px 32px rgba(0,0,0,0.08); transition:all 0.3s cubic-bezier(0.16, 1, 0.3, 1); opacity:0; transform:translateY(-20px); pointer-events:auto; letter-spacing:0.5px;`;
        t.textContent = msg;
        document.getElementById('toast-container').appendChild(t);
        
        requestAnimationFrame(() => { t.style.opacity = '1'; t.style.transform = 'translateY(0)'; });
        setTimeout(() => { 
          t.style.opacity = '0'; t.style.transform = 'translateY(-20px)';
          setTimeout(() => t.remove(), 300); 
        }, 3000);
      }
    };

    const UIConfirm = {
      bind(btn, confirmText, actionCallback) {
        if (btn.dataset.confirming === 'true') {
          btn.dataset.confirming = 'false';
          btn.innerHTML = btn.dataset.originalHtml;
          btn.style.borderColor = '';
          btn.style.color = '';
          actionCallback();
        } else {
          btn.dataset.originalHtml = btn.innerHTML;
          btn.dataset.confirming = 'true';
          btn.innerHTML = `<span style="font-weight:600; font-size:0.85rem;">${confirmText}</span>`;
          btn.style.borderColor = '#ff4d4f';
          btn.style.color = '#ff4d4f';
          setTimeout(() => {
            if (btn.dataset.confirming === 'true') {
              btn.dataset.confirming = 'false';
              btn.innerHTML = btn.dataset.originalHtml;
              btn.style.borderColor = '';
              btn.style.color = '';
            }
          }, 3000);
        }
      }
    };

    // ============================================================================
    
    
    const StateStore = {
      state: { 
        activeProject: '', clientName: '', audioQueue: [], contractorOcrItems: [], contractorInquiries: [],
        interviewRecords: [], activeRecordIdx: 0, 
        quotationDraftItems: [], financialControls: { discountAmount: 0, managementFeeRate: 8 }, 
        calculatedSummary: { totalCost: 0, quoteTotal: 0, taxAmount: 0, grossProfit: 0, grossMarginRate: 0, finalPayable: 0 }, 
        terminologyDb: [] 
      },
      init() {}, get(k) { return this.state[k]; }, set(k, v) { this.state[k] = v; }
    };

    const ApiQueue = {
      sendRequest(action, data) {
        return new Promise((resolve, reject) => {
          const payload = { action, data };
          if (typeof google !== 'undefined' && google.script && google.script.run) {
            google.script.run
              .withSuccessHandler(res => {
                try { if (typeof res === 'string') res = JSON.parse(res); } catch(e){}
                if (res && res.status === 'error') reject(new Error(res.message));
                else resolve(res && res.data ? res.data : res); 
              })
              .withFailureHandler(err => reject(err))
              .processServerAction(JSON.stringify(payload));
          } else {
            
            fetch(GAS_WEB_URL, {
              method: 'POST',
              headers: { 'Content-Type': 'text/plain;charset=utf-8' },
              body: JSON.stringify(payload)
            })
            .then(r => r.json())
            .then(res => {
              if (res && res.status === 'error') reject(new Error(res.message));
              else resolve(res && res.data ? res.data : res);
            })
            .catch(reject);
          }
        });
      }
    };

    const RedrawIcons = () => { if(window.lucide) lucide.createIcons({ strokeWidth: 1.2 }); };

    
    
    
    const DesignManager = {
      switchMobileTab(side) {
        document.getElementById('btn-mobile-left').classList.remove('active');
        document.getElementById('btn-mobile-right').classList.remove('active');
        document.getElementById('design-panel-left').classList.remove('active');
        document.getElementById('design-panel-right').classList.remove('active');
        if (side === 'left') {
          document.getElementById('btn-mobile-left').classList.add('active');
          document.getElementById('design-panel-left').classList.add('active');
        } else {
          document.getElementById('btn-mobile-right').classList.add('active');
          document.getElementById('design-panel-right').classList.add('active');
        }
      },
      
      addNewRecord() {
        const records = StateStore.get('interviewRecords');
        const newIdx = records.length;
        records.push({
          _rowId: null, recordId: 'REC-D-' + Date.now(), title: `洽談 #${newIdx + 1}`,
          images: [], currentImageIdx: 0, description: '', proExplanation: '', materials: []
        });
        StateStore.state.activeRecordIdx = newIdx;
        this.renderRecordsList();
        this.renderMaterialsTable();
      },

      copyRecord(idx) {
        const records = StateStore.get('interviewRecords');
        const copy = JSON.parse(JSON.stringify(records[idx]));
        copy._rowId = null; copy.recordId = 'REC-D-' + Date.now(); copy.title += ' (複製)';
        records.push(copy);
        StateStore.state.activeRecordIdx = records.length - 1;
        this.renderRecordsList(); this.renderMaterialsTable();
      },

      deleteRecord(idx) {
        const records = StateStore.get('interviewRecords');
        records.splice(idx, 1);
        StateStore.state.activeRecordIdx = Math.max(0, idx - 1);
        if (records.length === 0) this.addNewRecord();
        else { this.renderRecordsList(); this.renderMaterialsTable(); }
        Toast.show('紀錄已刪除');
      },

      selectRecord(idx, e) {
        if(e && (e.target.tagName === 'BUTTON' || e.target.closest('button') || e.target.tagName === 'INPUT')) return;
        if (StateStore.state.activeRecordIdx === idx) {
          const content = document.getElementById(`record-content-${idx}`);
          if(content) {
            content.classList.toggle('active');
            const header = content.previousElementSibling;
            if(header) header.classList.toggle('active-record');
          }
          return;
        }
        StateStore.state.activeRecordIdx = idx;
        this.renderRecordsList();
        this.renderMaterialsTable();
        if (window.innerWidth < 1024) this.switchMobileTab('right'); 
      },

      async handleImageUpload(input, idx) {
        const files = input.files;
        if (!files || files.length === 0) return;
        const record = StateStore.state.interviewRecords[idx];
        const projectId = StateStore.get('activeProject');
        
        if(!projectId) return Toast.show('請先選擇專案', 'error');

        const readImage = (file) => new Promise(res => {
          const reader = new FileReader();
          reader.onload = e => res(e.target.result);
          reader.readAsDataURL(file);
        });
        
        
        if (record.images && record.images.length > 0) {
          record.images = record.images.filter(img => img.startsWith('http'));
        } else {
          record.images = [];
        }

        for (let i = 0; i < files.length; i++) {
          const file = files[i];
          const progressPercent = Math.round(((i + 1) / files.length) * 100);
          Toast.show(`上傳與 AI 專業解析中... 第 ${i + 1}/${files.length} 張 (${progressPercent}%)`, 'info');
          
          try {
            const base64Str = await readImage(file);
            const cleanBase64 = base64Str.split(',')[1];
            const mimeType = file.type || 'image/jpeg';
            
            // 呼叫後端：實體化 Drive 圖檔並進行專業室內設計師解析
            const res = await ApiQueue.sendRequest('processAndAnalyzeDesignImage', { 
              projectId: projectId, 
              fileName: file.name, 
              fileBase64: cleanBase64, 
              mimeType: mimeType 
            });

            if(res && res.imageUrl) {
              record.images.push(res.imageUrl);
              record.currentImageIdx = record.images.length - 1;
              
              // 將設計師觀點累加至文字框中
              if (res.aiDescription) {
                record.description = (record.description ? record.description + '\n\n' : '') + `【圖 ${i+1} 空間解析】\n` + res.aiDescription;
              }
              
              // 每處理完一張就背景寫入試算表，確保資料絕對落地，並更新前端渲染
              await this.silentSaveRecord(idx);
              this.renderRecordsList();
            }
          } catch (err) {
            Toast.show(`第 ${i + 1} 張處理失敗: ${err.message}`, 'error');
          }
        }
        
        Toast.show('✅ 所有渲染圖檔上傳與 AI 解析完成！');
        input.value = ''; // 釋放 input 避免阻擋下次同檔名上傳
      },

      deleteImage(idx) {
        const record = StateStore.state.interviewRecords[idx];
        if (!record.images || record.images.length === 0) return;
        record.images.splice(record.currentImageIdx, 1);
        if (record.currentImageIdx >= record.images.length) record.currentImageIdx = Math.max(0, record.images.length - 1);
        this.renderRecordsList();
        this.silentSaveRecord(idx);
        Toast.show('圖片已移除');
      },

      async silentSaveRecord(idx) {
        const projectId = StateStore.get('activeProject');
        if(!projectId) return;
        try {
          const res = await ApiQueue.sendRequest('saveInterviewRecordsData', { projectId: projectId, record: StateStore.state.interviewRecords[idx] });
          if(res && res.rowId) StateStore.state.interviewRecords[idx]._rowId = res.rowId;
        } catch(err) { console.error(err); }
      },

      async manualSaveRecord(idx) {
        const projectId = StateStore.get('activeProject');
        if(!projectId) return Toast.show('請先選擇專案', 'error');
        Toast.show('儲存中...', 'info');
        try {
          const res = await ApiQueue.sendRequest('saveInterviewRecordsData', { projectId: projectId, record: StateStore.state.interviewRecords[idx] });
          if(res && res.rowId) StateStore.state.interviewRecords[idx]._rowId = res.rowId;
          Toast.show('紀錄儲存成功');
        } catch(err) { Toast.show('儲存失敗', 'error'); }
      },

      carouselGo(idx, dir) {
        const record = StateStore.state.interviewRecords[idx];
        if (!record.images || record.images.length <= 1) return;
        record.currentImageIdx += dir;
        if (record.currentImageIdx >= record.images.length) record.currentImageIdx = 0;
        if (record.currentImageIdx < 0) record.currentImageIdx = record.images.length - 1;
        this.renderRecordsList();
      },

      updateField(idx, field, val) { StateStore.state.interviewRecords[idx][field] = val; },

      async analyzeImages(idx) {
        const record = StateStore.state.interviewRecords[idx];
        if(!record.images || record.images.length === 0) return Toast.show('請先上傳圖片', 'error');
        Toast.show('AI 視覺深度解析中...', 'info');
        try {
          const imgData = record.images[record.currentImageIdx];
          let fileId = '';
          let base64Str = '';
          
          if (imgData.includes('/d/')) {
            const match = imgData.match(/\/d\/([a-zA-Z0-9_-]+)/);
            if(match) fileId = match[1];
          } else if (imgData.includes(',')) {
            base64Str = imgData.split(',')[1];
          } else {
            base64Str = imgData;
          }

          const res = await ApiQueue.sendRequest('processDesignFileOcr', { 
            projectId: StateStore.get('activeProject'), 
            fileId: fileId,
            fileBase64: base64Str, 
            mimeType: 'image/jpeg' 
          });
          
          if(res) {
            record.description = res.description || '自動解析特徵完成。';
            record.proExplanation = res.proExplanation || '建議選用低甲醛板材，收邊細節搭配現代簡約。';
            this.renderRecordsList();
            Toast.show('解析完成，已寫入紀錄');
          }
        } catch(err) { 
          Toast.show('解析失敗: ' + err.message, 'error'); 
          console.error(err); 
        }
      },

      extractToMaterials(idx) {
        const record = StateStore.state.interviewRecords[idx];
        const mockMats = [
          { space:'客廳', zone:'電視牆', name:'系統板材', material:'E1-V313', qty:1, unit:'式', price:15000 },
          { space:'客廳', zone:'地坪', name:'超耐磨地板', material:'比利時', qty:5, unit:'坪', price:4200 }
        ];
        record.materials = record.materials.concat(mockMats);
        this.selectRecord(idx); 
        Toast.show('已提取至選材表');
      },

      addEmptyMaterial() {
        const records = StateStore.get('interviewRecords');
        if(records.length === 0) return;
        records[StateStore.state.activeRecordIdx].materials.push({ space:'', zone:'', name:'', material:'', qty:1, unit:'式', price:0 });
        this.renderMaterialsTable();
      },

      updateMaterial(mIdx, field, val) {
        StateStore.state.interviewRecords[StateStore.state.activeRecordIdx].materials[mIdx][field] = val;
        if(field === 'qty' || field === 'price') this.renderMaterialsTable(); 
      },

      removeMaterial(mIdx) {
        StateStore.state.interviewRecords[StateStore.state.activeRecordIdx].materials.splice(mIdx, 1);
        this.renderMaterialsTable();
      },

      async saveCurrentRecord() { this.manualSaveRecord(StateStore.state.activeRecordIdx); },

      renderRecordsList() {
        const container = document.getElementById('design-records-container');
        const records = StateStore.get('interviewRecords');
        const activeIdx = StateStore.state.activeRecordIdx;

        if (records.length === 0) { container.innerHTML = `<div style="padding:40px; text-align:center; color:var(--text-muted);">無紀錄</div>`; return; }

        container.innerHTML = records.map((r, i) => {
          const isActive = (i === activeIdx);
          const imgs = r.images || [];
          const cIdx = r.currentImageIdx || 0;
          
          let carouselHtml = `<div style="color:var(--text-muted); font-size:0.9rem;">尚未上傳圖檔</div>`;
          if (imgs.length > 0) {
            carouselHtml = `
              <button class="carousel-btn left" onclick="DesignManager.carouselGo(${i}, -1)"><i data-lucide="chevron-left"></i></button>
              <img src="${imgs[cIdx]}" class="carousel-img active">
              <button class="carousel-btn right" onclick="DesignManager.carouselGo(${i}, 1)"><i data-lucide="chevron-right"></i></button>
              <button onclick="UIConfirm.bind(this, '移除?', () => DesignManager.deleteImage(${i}))" style="position:absolute; top:12px; right:12px; background:#FFF; border:none; width:36px; height:36px; cursor:pointer;" title="刪除圖檔">
                <i data-lucide="x" style="width:16px;"></i>
              </button>
            `;
          }

          return `
            <div class="accordion-item">
              <div class="accordion-header ${isActive ? 'active-record' : ''}" onclick="DesignManager.selectRecord(${i}, event)">
                <span>${r.title}</span>
                <div style="display:flex; gap:12px;">
                  <button class="btn" style="min-height:28px; padding:0 8px; border:none;" onclick="event.stopPropagation(); DesignManager.copyRecord(${i})" title="複製"><i data-lucide="copy" style="width:18px;"></i></button>
                  <button class="btn" style="min-height:28px; padding:0 8px; border:none;" onclick="event.stopPropagation(); UIConfirm.bind(this, '刪除?', () => DesignManager.deleteRecord(${i}))" title="刪除"><i data-lucide="trash-2" style="width:18px;"></i></button>
                </div>
              </div>
              <div id="record-content-${i}" class="accordion-content ${isActive ? 'active' : ''}">
                <div class="input-field-group">
                  <label class="input-field-label">紀錄標題</label>
                  <input type="text" class="spec-input" value="${r.title}" onblur="DesignManager.updateField(${i},'title',this.value)">
                </div>
                
                <div style="display:flex; justify-content:space-between; margin:24px 0 12px 0; align-items:center;">
                  <label class="input-field-label">視覺參考圖</label>
                  <button class="btn" style="min-height:32px;" onclick="document.getElementById('upload-img-${i}').click()"><i data-lucide="upload"></i> 上傳</button>
                  <input type="file" id="upload-img-${i}" multiple accept="image/*" style="display:none;" onchange="DesignManager.handleImageUpload(this, ${i})">
                </div>
                <div class="carousel-container">${carouselHtml}</div>

                <button class="btn" style="width:100%; margin-bottom:24px;" onclick="DesignManager.analyzeImages(${i})">
                  <i data-lucide="sparkles"></i> AI 視覺解析
                </button>
                
                <div class="input-field-group">
                  <label class="input-field-label">畫面描述</label>
                  <textarea class="spec-input" onblur="DesignManager.updateField(${i},'description',this.value)">${r.description}</textarea>
                </div>
                <div class="input-field-group">
                  <label class="input-field-label">專業建議</label>
                  <textarea class="spec-input" onblur="DesignManager.updateField(${i},'proExplanation',this.value)">${r.proExplanation}</textarea>
                </div>

                <div style="display:flex; gap:16px; margin-top:32px;">
                  <button class="btn btn-primary" style="flex:1;" onclick="DesignManager.manualSaveRecord(${i})">儲存</button>
                  <button class="btn" style="flex:1;" onclick="DesignManager.extractToMaterials(${i})"><i data-lucide="arrow-right"></i> 提取選材</button>
                </div>
              </div>
            </div>
          `;
        }).join('');
        RedrawIcons();
      },

      renderMaterialsTable() {
        const tbody = document.getElementById('design-materials-tbody');
        const titleEl = document.getElementById('current-record-title');
        const records = StateStore.get('interviewRecords');
        const activeIdx = StateStore.state.activeRecordIdx;
        
        if(records.length === 0 || !records[activeIdx]) {
          titleEl.textContent = '選材清單';
          tbody.innerHTML = `<tr><td colspan="9" style="text-align:center; padding:40px; color:var(--text-muted);">無資料</td></tr>`;
          return;
        }

        const record = records[activeIdx];
        titleEl.textContent = `${record.title}`;
        
        let mats = record.materials || [];
        mats.sort((a, b) => {
          if (a.space !== b.space) return (a.space || '').localeCompare(b.space || '');
          return (a.zone || '').localeCompare(b.zone || '');
        });

        if (mats.length === 0) {
          tbody.innerHTML = `<tr><td colspan="9" style="text-align:center; padding:40px; color:var(--text-muted);">請新增或自動提取</td></tr>`;
          return;
        }

        let currentSpace = null;
        let html = '';
        let totalSum = 0;

        mats.forEach((m, idx) => {
          if (currentSpace !== m.space) {
            currentSpace = m.space;
            html += `<tr style="background:#FAFAFA;"><td colspan="9" style="font-weight:700; padding:16px 12px; font-family:'Noto Serif TC', serif; color:#111;">${currentSpace || '未分類空間'}</td></tr>`;
          }
          const qty = Number(m.qty) || 0; const price = Number(m.price) || 0; const subtotal = Math.round(qty * price);
          totalSum += subtotal;

          html += `
            <tr>
              <td style="color:var(--text-muted);">${idx + 1}</td>
              <td><input type="text" value="${m.space}" onblur="DesignManager.updateMaterial(${idx},'space',this.value)"></td>
              <td><input type="text" value="${m.zone}" onblur="DesignManager.updateMaterial(${idx},'zone',this.value)"></td>
              <td><input type="text" value="${m.material}" onblur="DesignManager.updateMaterial(${idx},'material',this.value)"></td>
              <td><input type="number" value="${m.qty}" onblur="DesignManager.updateMaterial(${idx},'qty',this.value)"></td>
              <td><input type="text" value="${m.unit}" onblur="DesignManager.updateMaterial(${idx},'unit',this.value)"></td>
              <td><input type="number" value="${m.price}" onblur="DesignManager.updateMaterial(${idx},'price',this.value)"></td>
              <td style="font-family:'Inter', sans-serif;">$${subtotal.toLocaleString()}</td>
              <td style="text-align:center;">
                <button onclick="UIConfirm.bind(this, '確認?', () => DesignManager.removeMaterial(${idx}))" style="background:none; border:none; cursor:pointer;" title="刪除"><i data-lucide="trash-2" style="width:18px;"></i></button>
              </td>
            </tr>
          `;
        });
        
        html += `<tr><td colspan="7" style="text-align:right; font-weight:700;">總計：</td><td colspan="2" style="font-family:'Inter', sans-serif; font-weight:700; font-size:1.1rem;">$${totalSum.toLocaleString()}</td></tr>`;
        tbody.innerHTML = html;
        RedrawIcons();
      }
    };

    const CostManager = {
      activeInquiryIdx: 0,
      init() { if (!StateStore.state.contractorInquiries) StateStore.state.contractorInquiries = []; this.renderInquiries(); this.renderCostTable(); },
      async uploadBlueprint(idx, input) {
        const file = input.files[0]; if(!file) return;
        Toast.show('藍圖上傳中...', 'info');
        try {
          const base64 = await new Promise(res => { const r = new FileReader(); r.onload = e => res(e.target.result.split(',')[1]); r.readAsDataURL(file); });
          const pId = StateStore.get('activeProject');
          const res = await ApiQueue.sendRequest('uploadBlueprintPdf', { projectId: pId, fileName: file.name, mimeType: file.type, fileBase64: base64 });
          if(res && res.url) {
            this.updateField(idx, 'blueprintUrl', res.url);
            const r = StateStore.state.contractorInquiries[idx];
            r.inquiryText = (r.inquiryText || '') + `\n\n施工藍圖下載連結:\n${res.url}`;
            this.renderInquiries();
            Toast.show('藍圖上傳成功，已加入推播內容');
          }
        } catch(e) { Toast.show('上傳失敗，請確認網路狀態', 'error'); }
      },
      addInquiry() { 
        if (!StateStore.state.contractorInquiries) StateStore.state.contractorInquiries = [];
        StateStore.state.contractorInquiries.push({ category: '木作工程', contractor: '', lineId: '', inquiryText: '', chatHistory: '' }); 
        this.activeInquiryIdx = StateStore.state.contractorInquiries.length - 1; 
        this.renderInquiries(); 
      },
      copyInquiry(idx) { 
        if (!StateStore.state.contractorInquiries) StateStore.state.contractorInquiries = [];
        StateStore.state.contractorInquiries.push(JSON.parse(JSON.stringify(StateStore.state.contractorInquiries[idx]))); 
        this.activeInquiryIdx = StateStore.state.contractorInquiries.length - 1; 
        this.renderInquiries(); 
      },
      deleteInquiry(idx) { StateStore.state.contractorInquiries.splice(idx, 1); this.activeInquiryIdx = Math.max(0, idx - 1); this.renderInquiries(); Toast.show('廠商已刪除'); },
      selectInquiry(idx, e) {
        if(e && (e.target.tagName === 'BUTTON' || e.target.closest('button') || e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT')) return;
        if (this.activeInquiryIdx === idx) {
          const content = document.getElementById(`cost-inquiry-content-${idx}`);
          if(content) { content.classList.toggle('active'); content.previousElementSibling.classList.toggle('active-record'); }
          return;
        }
        this.activeInquiryIdx = idx; this.renderInquiries();
      },
      updateField(idx, field, val) { StateStore.state.contractorInquiries[idx][field] = val; },
      async autoGenerateFromMaterials() {
        const pId = StateStore.get('activeProject');
        if(!pId) return Toast.show('請選擇專案', 'error');
        
        const records = StateStore.get('interviewRecords');
        if(records.length === 0) return Toast.show('選材區尚無紀錄', 'error');

        Toast.show('AI 統包設計師分析與發包策略擬定中...', 'info');
        
        try {
          const res = await ApiQueue.sendRequest('generateSmartInquiries', { 
            projectId: pId, 
            records: records 
          });
          
          if(res && res.inquiries && res.inquiries.length > 0) {
            StateStore.state.contractorInquiries = StateStore.state.contractorInquiries.concat(res.inquiries);
            this.activeInquiryIdx = StateStore.state.contractorInquiries.length - 1;
            this.renderInquiries(); 
            Toast.show('AI 智能發包規劃完成，已產生工班詢價單');
          } else {
            Toast.show('AI 無法產出有效發包', 'error');
          }
        } catch(err) {
          Toast.show('智能發包失敗: ' + err.message, 'error');
        }
      },
      sendToLine(idx) {
        const text = StateStore.state.contractorInquiries[idx].inquiryText;
        if(!text) return Toast.show('請先填寫內容', 'error');
        window.open('https:
      },
      async parseQuote(idx) {
        const pId = StateStore.get('activeProject');
        if(!pId) return Toast.show('請選擇專案', 'error');
        const record = StateStore.state.contractorInquiries[idx];
        const fileInput = document.getElementById(`cost-upload-${idx}`);

        Toast.show('AI 解析單據中...', 'info');
        try {
           let newItems = [];
           if (fileInput.files && fileInput.files.length > 0) {
             for (let i = 0; i < fileInput.files.length; i++) {
               const file = fileInput.files[i];
               const base64 = await new Promise(res => { const r = new FileReader(); r.onload = e => res(e.target.result.split(',')[1]); r.readAsDataURL(file); });
               const res = await ApiQueue.sendRequest('batchOcrContractors', { projectId: pId, mimeType: file.type, fileName: file.name, fileBase64: base64 });
               if (res && res.parsedItems) newItems = newItems.concat(res.parsedItems);
             }
           } else if (record.chatHistory && record.chatHistory.trim()) {
               const res = await ApiQueue.sendRequest('batchOcrContractors', { projectId: pId, mimeType: 'text/plain', fileName: 'chat.txt', fileBase64: btoa(unescape(encodeURIComponent(record.chatHistory))) });
               if (res && res.parsedItems) newItems = newItems.concat(res.parsedItems);
           } else { return Toast.show('請上傳檔案', 'error'); }

           if (newItems.length > 0) {
               StateStore.state.contractorOcrItems = StateStore.state.contractorOcrItems.concat(newItems);
               let resText = "【提取工項】\n";
               newItems.forEach((item, _idx) => { resText += `[${_idx+1}] ${item.itemName||'無'} | ${item.quantity}${item.unit} | $${item.unitCost}\n`; });
               record.parsedResultText = (record.parsedResultText ? record.parsedResultText + "\n" : "") + resText;
               this.renderCostTable(); this.renderInquiries(); Toast.show('解析並加入成本');
               if(fileInput) fileInput.value = '';
           } else { Toast.show('未辨識到工項', 'error'); }
        } catch(err) { Toast.show('解析失敗', 'error'); }

      addEmptyCostItem() { StateStore.state.contractorOcrItems.push({ category: '綜合工程', contractorName: '', spaceName: '', itemName: '', quantity: 1, unit: '式', unitCost: 0, subtotalCost: 0 }); this.renderCostTable(); },
      updateCostItem(idx, field, val) { StateStore.state.contractorOcrItems[idx][field] = val; this.renderCostTable(); },
      removeCostItem(idx) { StateStore.state.contractorOcrItems.splice(idx, 1); this.renderCostTable(); Toast.show('成本已移除'); },
      saveInquiries() {
        const pId = StateStore.get('activeProject'); if(!pId) return Toast.show('請選擇專案', 'error');
        Toast.show('儲存中...', 'info');
        ApiQueue.sendRequest('saveContractorInquiries', { projectId: pId, items: StateStore.state.contractorInquiries })
          .then(() => Toast.show('清單已儲存')).catch(() => Toast.show('儲存失敗', 'error'));
      },
      saveAllCosts() {
         const pId = StateStore.get('activeProject'); if(!pId) return Toast.show('請選擇專案', 'error');
         Toast.show('儲存中...', 'info');
         ApiQueue.sendRequest('saveContractorCosts', { projectId: pId, items: StateStore.state.contractorOcrItems })
           .then(() => Toast.show('專案成本已成功寫入資料庫')).catch(() => Toast.show('儲存失敗', 'error'));
      },

          return `

                   <div class="input-field-group"><label class="input-field-label">廠商</label><input type="text" class="spec-input" value="${r.contractor}" onblur="CostManager.updateField(${i},'contractor',this.value); CostManager.renderInquiries();"></div>

                <div class="input-field-group">
                  <label class="input-field-label">詢價內容</label>

                     <div class="input-field-group"><label class="input-field-label">對話紀錄</label><textarea class="spec-input" style="min-height:80px;" onblur="CostManager.updateField(${i},'chatHistory',this.value)">${r.chatHistory}</textarea></div>
                     <div class="input-field-group"><label class="input-field-label">圖檔或 PDF</label><input type="file" id="cost-upload-${i}" class="spec-input" style="padding-top:8px;" accept="image
